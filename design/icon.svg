<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#14B8A6"/>
      <stop offset="1" stop-color="#0F5F73"/>
    </linearGradient>
    <!-- knock the back magnifier out where the front one overlaps -->
    <mask id="cut">
      <rect width="128" height="128" fill="#fff"/>
      <g stroke="#000" stroke-width="17" stroke-linecap="round" fill="#000">
        <circle cx="72" cy="72" r="15"/>
        <line x1="83" y1="83" x2="94" y2="94"/>
      </g>
    </mask>
  </defs>
  <!-- 96x96 artwork, 16px transparent padding per side -->
  <rect x="16" y="16" width="96" height="96" rx="22" fill="url(#bg)"/>
  <!-- parent: back magnifier -->
  <g mask="url(#cut)" stroke="#fff" stroke-opacity="0.55" stroke-width="7" stroke-linecap="round" fill="none">
    <circle cx="45" cy="45" r="15"/>
    <line x1="56" y1="56" x2="61" y2="61"/>
  </g>
  <!-- child: front magnifier with + -->
  <g stroke="#fff" stroke-width="7" stroke-linecap="round" fill="none">
    <circle cx="72" cy="72" r="15"/>
    <line x1="83" y1="83" x2="94" y2="94"/>
  </g>
  <g stroke="#fff" stroke-width="5" stroke-linecap="round">
    <line x1="72" y1="65" x2="72" y2="79"/>
    <line x1="65" y1="72" x2="79" y2="72"/>
  </g>
</svg>
